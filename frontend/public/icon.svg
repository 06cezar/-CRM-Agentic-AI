<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background matching app card color -->
  <rect width="100" height="100" rx="22" fill="#141520"/>
  <!-- Cpu icon from lucide-react, scaled to 60x60 centered at 50,50 -->
  <!-- Outer chip body -->
  <rect x="30" y="30" width="40" height="40" rx="5" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner processing unit -->
  <rect x="42" y="42" width="16" height="16" rx="2.5" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top pins -->
  <line x1="42" y1="22" x2="42" y2="30" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="22" x2="58" y2="30" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom pins -->
  <line x1="42" y1="70" x2="42" y2="78" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="70" x2="58" y2="78" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <!-- Left pins -->
  <line x1="22" y1="42" x2="30" y2="42" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="58" x2="30" y2="58" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <!-- Right pins -->
  <line x1="70" y1="42" x2="78" y2="42" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="58" x2="78" y2="58" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
</svg>
