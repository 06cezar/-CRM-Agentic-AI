server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            msg: event
            request_id: request_id
            method: method
            path: path
            status_code: status_code
            duration: duration
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          request_id:
          method:
          path:
          status_code:
